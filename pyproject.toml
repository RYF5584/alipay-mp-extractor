[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "alipay-mp-extractor"
version = "1.1.0"
description = "Extract and decompile Alipay (Android) mini-program packages from a rooted device - search, query and export mini-programs and plugins"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RYF5584" }]
requires-python = ">=3.8"
keywords = [
    "alipay", "mini-program", "miniapp", "android", "adb",
    "decompile", "unpack", "reverse-engineering", "security-research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "adbutils>=2.2",
    "jsbeautifier>=2.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alipay-mp = "alipay_mp_extractor.cli:main"
alipay-mp-extractor = "alipay_mp_extractor.cli:main"

[project.urls]
Homepage = "https://github.com/RYF5584/alipay-mp-extractor"
Repository = "https://github.com/RYF5584/alipay-mp-extractor"
Issues = "https://github.com/RYF5584/alipay-mp-extractor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alipay_mp_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = [
    "src/alipay_mp_extractor",
    "tests",
    "examples",
    "skills",
    "README.md",
    "README.en.md",
    "LICENSE",
    "pyproject.toml",
]
